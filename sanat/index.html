<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Suomi Kartat — Morfoloji &amp; Dil Stüdyosu</title>
    <meta
      name="description"
      content="Fince için editoryal arayüzlü, SM-2 aralıklı tekrar ve kart üzerinde canlı kök–ek röntgeni."
    />
    <meta name="theme-color" content="#F7F5F0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css?v=70b3532b" />
  </head>
  <body data-theme="linen">
    <a class="skip" href="#studyo">İçeriğe geç</a>

    <div class="shell">
      <header class="masthead">
        <p class="brand">
          <span class="brand-name">Suomi Kartat</span>
          <span class="brand-sub">Morfoloji &amp; Dil Stüdyosu</span>
        </p>
        <p class="mast-meta">
          <span id="mastStreak">seri —</span>
          <button class="link-btn" id="themeToggle" type="button" aria-pressed="false">
            Gece Fiyordu
          </button>
        </p>
      </header>

      <div class="rail" id="weekRail" role="group" aria-label="Haftalık ilerleme çizgisi"></div>

      <main id="studyo" class="views" tabindex="-1">
        <section class="view" id="view-study" data-panel="study" aria-label="Çalışma"></section>

        <section class="view" id="view-index" data-panel="index" aria-label="Dizin" hidden>
          <h1 class="view-title">Dizin</h1>
          <p class="lede">
            On altı hafta, 328 kart. Bir haftayı seç ya da sözlükte aradığın biçimi
            laboratuvarda aç.
          </p>
          <label class="field">
            <span class="sr-only">Fince veya Türkçe ara</span>
            <input
              id="searchInput"
              type="search"
              placeholder="Fince veya Türkçe ara…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <div id="indexBody"></div>
        </section>

        <section class="view" id="view-lab" data-panel="lab" aria-label="Morfoloji laboratuvarı" hidden>
          <h1 class="view-title">Laboratuvar</h1>
          <p class="lede">
            Herhangi bir Fince biçim yaz: kök, ek, ünlü uyumu ve ünsüz yumuşaması
            yazarken çözülür.
          </p>
          <label class="field">
            <span class="sr-only">Fince kelime veya cümle</span>
            <input
              id="labInput"
              type="text"
              placeholder="kaupungissani"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <div class="chips" id="labChips"></div>
          <div class="lab-out" id="labOut" aria-live="polite"></div>
        </section>

        <section class="view" id="view-ledger" data-panel="ledger" aria-label="Kayıt" hidden></section>
      </main>

      <nav class="dock" id="dock" aria-label="Ana bölümler">
        <button type="button" data-tab="study" aria-current="page">
          <span class="dock-num">01</span>
          <span class="dock-label">Çalış</span>
        </button>
        <button type="button" data-tab="index">
          <span class="dock-num">02</span>
          <span class="dock-label">Dizin</span>
        </button>
        <button type="button" data-tab="lab">
          <span class="dock-num">03</span>
          <span class="dock-label">Laboratuvar</span>
        </button>
        <button type="button" data-tab="ledger">
          <span class="dock-num">04</span>
          <span class="dock-label">Kayıt</span>
        </button>
      </nav>
    </div>

    <p id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <script src="data.js?v=70b3532b"></script>
    <script src="app.js?v=70b3532b"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
